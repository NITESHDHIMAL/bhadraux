<body>


    <script>

        let num = 50; //number
        let name = "Ram" //string
        // object eg.

        let iphone15 = { brand: "Apple", storage: 256, processor: "A17" }
        //array eg:
        let number = [2, 4, 5]
        let students = ["Ram", "Shyam", "Hari"]

            { name: "Mouse", brand: "Dell", price: "10K" },
            { name: "Keyboard", brand: "Logictech", price: "5k" },

        ]


        console.log(num, typeof (num))
        console.log(name, typeof (name))

        console.log(product.length);
        console.log(product[2])
    </script>
